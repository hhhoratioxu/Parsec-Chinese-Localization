name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x86_64
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Tests
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: GUI startup
        run: python -m parsec_chinese --smoke-test
      - name: Find Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $taskCompiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $taskCompiler)) {
            choco install innosetup --yes --no-progress
          }
      - name: Build app and installer
        run: python scripts/build.py
      - name: Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_installer.ps1
      - name: macOS app smoke test
        if: runner.os == 'macOS'
        run: dist/ParsecChineseLocalization.app/Contents/MacOS/ParsecChineseLocalization --smoke-test
      - name: macOS disk image check
        if: runner.os == 'macOS'
        run: |
          hdiutil verify release/*.dmg
          hdiutil attach release/*.dmg -readonly -nobrowse -mountpoint "$RUNNER_TEMP/pcl-dmg"
          "$RUNNER_TEMP/pcl-dmg/ParsecChineseLocalization.app/Contents/MacOS/ParsecChineseLocalization" --smoke-test
          hdiutil detach "$RUNNER_TEMP/pcl-dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.target }}
          path: artifacts/tests.xml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-*-*'
          path: downloads
      - name: Assemble release files and checksums
        shell: bash
        run: |
          mkdir -p release
          find downloads -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -exec cp {} release/ \;
          git archive --format=zip --prefix=Parsec-Chinese-Localization/ -o release/ParsecChineseLocalization-${GITHUB_REF_NAME}-source.zip HEAD
          cd release
          sha256sum *.exe *.dmg *.zip > SHA256SUMS.txt
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" release/* --prerelease --title "$GITHUB_REF_NAME — Chinese companion (experimental)" --notes-file docs/RELEASE_NOTES.md --verify-tag
